[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tallyprime"
dynamic = ["version"]
description = "Python client for the TallyPrime API"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Chirag Jain", email = "chirag@jumpfast.tech" },
]
keywords = ["tally", "tallyprime", "accounting", "api", "erp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/jumpfast-tech/tallyprime-api"
Repository = "https://github.com/jumpfast-tech/tallyprime-api"
Issues = "https://github.com/jumpfast-tech/tallyprime-api/issues"
Changelog = "https://github.com/jumpfast-tech/tallyprime-api/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/tallyprime/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tallyprime"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["tallyprime"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
